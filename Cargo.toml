[package]
name = "berger"
version = "0.1.0"
edition = "2024"
description = "Make tmux sessions agent-aware from Claude Code lifecycle hooks"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chrizzlekicks/berger"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
