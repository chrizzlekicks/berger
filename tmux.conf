# amux tmux configuration
# Source this from your ~/.tmux.conf or copy the relevant lines.

# Prevent tmux from overwriting window names set by amux
set -g allow-rename off
set -g automatic-rename off

# Keybinding: start amux watcher for the current session (M = meta/alt)
bind-key M run-shell "amux watch --session #{session_name} >/tmp/amux-#{session_name}.log 2>&1 &"

# Set AMUX_AGENT to the window name so Claude Code hooks use the right agent name
set-hook -g window-linked "run-shell 'tmux setenv AMUX_AGENT #{window_name}'"
set-hook -g window-renamed "run-shell 'tmux setenv AMUX_AGENT #{window_name}'"
